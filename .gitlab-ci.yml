# Core definitions
.core-defs:
  variables:
    CORENAME: holani

include:
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-windows-x64.yml'
    
  # Windows 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-windows-i686.yml'

  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-x64.yml'

  # Linux 32-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-i686.yml'

  # Linux aarch64
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-aarch64.yml'

  # macOS/iOS/tvOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-apple.yml'
    
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-android-jni.yml'

  # webOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-webos.yml'

stages:
  - build-prepare
  - build-shared
  - build-static

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-rust-windows-x64-default
    - .core-defs
        
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-rust-linux-x64-default
    - .core-defs

# Linux aarch64
libretro-build-linux-aarch64:
  extends:
    - .libretro-rust-linux-aarch64-default
    - .core-defs

# Linux 32-bit
libretro-build-linux-i686:
  extends:
    - .libretro-rust-linux-i686-default
    - .core-defs

# Windows 32-bit
libretro-build-windows-i686:
  extends:
    - .libretro-rust-windows-i686-default
    - .core-defs

# MacOS 64-bit
# SDKROOT is exported here because the template's does not run: ci-templates'
# .libretro-rust-apple-osx-base exports it in a before_script, and the two
# -default templates below it define before_scripts of their own, which
# replace it. Without the SDK, bindgen parses libretro.h against the Linux
# host's headers - which happened to be enough until the rust image was
# rebuilt on 2026-09-21 (gcc-multilib went then), and since that both jobs
# fail on 'bits/libc-header-start.h' file not found. iOS and tvOS export theirs in
# their own templates, which is why they still build.
libretro-build-osx-x64:
  extends:
    - .libretro-rust-osx-x86_64-default
    - .core-defs
  variables:
    CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup
  before_script:
    - !reference [.libretro-rust-osx-x86_64-default, before_script]
    - export SDKROOT=$OSX_SDKROOT
# MacOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-rust-osx-arm64-default
    - .core-defs
  variables:
    CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup
  before_script:
    - !reference [.libretro-rust-osx-arm64-default, before_script]
    - export SDKROOT=$OSX_SDKROOT

# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-rust-android-jni-armeabi-v7a
    - .core-defs
# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-rust-android-jni-arm64-v8a
    - .core-defs
# Android 64-bit x86
android-x86_64:
  extends:
    - .libretro-rust-android-jni-x86_64
    - .core-defs
# Android 32-bit x86
android-x86:
  extends:
    - .libretro-rust-android-jni-x86
    - .core-defs

# iOS
libretro-build-ios-arm64:
  extends:
    - .libretro-rust-ios-arm64-default
    - .core-defs
  variables:
    CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup

# tvOS
libretro-build-tvos-arm64:
  extends:
    - .libretro-rust-tvos-arm64-default
    - .core-defs
  variables:
    CARGO_TARGET_AARCH64_APPLE_TVOS_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup

# webOS
libretro-build-webos-armv7a:
  extends:
    - .libretro-rust-webos-armv7a-default
    - .core-defs
