# Core definitions
.core-defs:
  variables:
    CORENAME: holani

include:
  # Windows 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-windows-x64.yml'
    
  # Linux 64-bit
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-linux-x64.yml'

  # macOS/iOS/tvOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-apple.yml'
    
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-android-jni.yml'

  # webOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/rust-webos.yml'

stages:
  - build-prepare
  - build-shared
  - build-static

# Windows 64-bit
libretro-build-windows-x64:
  extends:
    - .libretro-rust-windows-x64-default
    - .core-defs
        
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-rust-linux-x64-default
    - .core-defs

# Linux aarch64
# Cross-compiled from the same image as the x64 job, the way the image already
# cross-compiles the Apple and Android arm64 targets. There is no
# rust-linux-aarch64.yml template yet (libretro/libretro-super#2030) and the
# rust image is amd64-only, so the target and its linker are added here.
libretro-build-linux-aarch64:
  extends:
    - .libretro-rust-linux-x64
    - .core-defs
  variables:
    TARGET_ARCH: aarch64-unknown-linux-gnu
    STRIP: aarch64-linux-gnu-strip
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  before_script:
    - apt-get update -qy && apt-get install -yq gcc-aarch64-linux-gnu
    - rustup target add aarch64-unknown-linux-gnu

# Linux 32-bit
# Same story as the aarch64 job above: no rust-linux-i686.yml template, and the
# rust image is amd64, so the target and the 32-bit runtime go in here.
libretro-build-linux-i686:
  extends:
    - .libretro-rust-linux-x64
    - .core-defs
  variables:
    TARGET_ARCH: i686-unknown-linux-gnu
  before_script:
    - apt-get update -qy && apt-get install -yq gcc-multilib
    - rustup target add i686-unknown-linux-gnu

# Windows 32-bit
# Not gcc: the image's i686 mingw is the SJLJ flavour, and rust's
# i686-pc-windows-gnu std unwinds with DWARF, so libgcc has no _Unwind_Resume
# for it and the link ends there. llvm-mingw carries a libunwind that does -
# stood in as libgcc_eh - plus an empty libgcc for the -lgcc the same link
# line asks for. dlltool still has to be the GNU one; rustc calls it itself
# for raw-dylib and llvm-dlltool does not stand in.
libretro-build-windows-i686:
  extends:
    - .libretro-rust-windows-x64
    - .core-defs
  variables:
    TARGET_ARCH: i686-pc-windows-gnu
    LLVM_MINGW: llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64
    STRIP: /opt/llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64/bin/llvm-strip
    CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: /opt/llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64/bin/i686-w64-mingw32-clang
    CARGO_TARGET_I686_PC_WINDOWS_GNU_RUSTFLAGS: -L /opt/gcc-stub
  before_script:
    - apt-get update -qy && apt-get install -yq binutils-mingw-w64-i686
    - curl -sSL -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20230320/$LLVM_MINGW.tar.xz"
    - tar xJf /tmp/llvm-mingw.tar.xz -C /opt
    - mkdir -p /opt/gcc-stub
    - /opt/$LLVM_MINGW/bin/llvm-ar crs /opt/gcc-stub/libgcc.a
    - cp /opt/$LLVM_MINGW/i686-w64-mingw32/lib/libunwind.a /opt/gcc-stub/libgcc_eh.a
    - rustup target add i686-pc-windows-gnu

# MacOS 64-bit
libretro-build-osx-x64:
  extends:
    - .libretro-rust-osx-x86_64-default
    - .core-defs
  variables:
    CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup
# MacOS ARM 64-bit
libretro-build-osx-arm64:
  extends:
    - .libretro-rust-osx-arm64-default
    - .core-defs
  variables:
    CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup

# Android ARMv7a
android-armeabi-v7a:
  extends:
    - .libretro-rust-android-jni-armeabi-v7a
    - .core-defs
# Android ARMv8a
android-arm64-v8a:
  extends:
    - .libretro-rust-android-jni-arm64-v8a
    - .core-defs
# Android 64-bit x86
android-x86_64:
  extends:
    - .libretro-rust-android-jni-x86_64
    - .core-defs
# Android 32-bit x86
android-x86:
  extends:
    - .libretro-rust-android-jni-x86
    - .core-defs

# iOS
libretro-build-ios-arm64:
  extends:
    - .libretro-rust-ios-arm64-default
    - .core-defs
  variables:
    CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup

# tvOS
libretro-build-tvos-arm64:
  extends:
    - .libretro-rust-tvos-arm64-default
    - .core-defs
  variables:
    CARGO_TARGET_AARCH64_APPLE_TVOS_RUSTFLAGS: -Clink-arg=-undefined -Clink-arg=dynamic_lookup

# webOS
libretro-build-webos-armv7a:
  extends:
    - .libretro-rust-webos-armv7a-default
    - .core-defs
