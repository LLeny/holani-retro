[package]
name = "holani-retro"
version = "1.0.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
holani = { git = "https://github.com/LLeny/holani.git", tag = "1.0.0" }
log = { version = "0.4.29", features = [
  "max_level_trace",
  "release_max_level_warn",
] }
libretro-rs = { git = "https://github.com/LLeny/libretro-rs.git", rev = "c3a60b3b69b52b29a463e9895cb2d7fdc5cfc1a6" }
lazy_static = "1.5.0"

[lib]
name = "holani"
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = "thin"
